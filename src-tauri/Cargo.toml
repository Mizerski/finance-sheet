[package]
name = "projecao-financeira"
version = "0.6.0"
description = "Controle e projeção financeira dia a dia"
authors = ["Mizerski"]
license = ""
repository = "https://github.com/Mizerski/finance-sheet"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "projecao_financeira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# Assistente local: download do modelo e conversa com o llama-server (rustls com ring, como o updater).
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
# Job do Windows: o llama-server morre junto com o app.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# No desenvolvimento, conferir o sha256 de um modelo de alguns GB fica lento sem otimização.
[profile.dev.package.sha2]
opt-level = 3
