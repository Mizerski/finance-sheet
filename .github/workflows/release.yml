# Gera os instaladores do app desktop (por enquanto só Windows) e publica numa Release do GitHub.
# Dispara ao enviar uma tag de versão: git tag v0.2.0 && git push origin v0.2.0
# A tag precisa ser igual à versão do package.json (com "v" na frente).

name: Release desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  criar-release:
    name: Criar rascunho da release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.criar.outputs.result }}
    steps:
      - uses: actions/checkout@v5

      - name: Conferir tag e versão
        run: |
          versao="v$(node -p "require('./package.json').version")"
          if [ "$versao" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do package.json ($versao)."
            exit 1
          fi

      - id: criar
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            // Reaproveita o rascunho de uma execução anterior da mesma tag (ex.: depois de uma falha).
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo)
            const anterior = releases.find((r) => r.tag_name === tag)
            if (anterior && !anterior.draft) throw new Error(`A release ${tag} já foi publicada.`)
            if (anterior) {
              for (const asset of anterior.assets) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id })
              }
              return anterior.id
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `Projeção Financeira ${tag}`,
              draft: true,
              generate_release_notes: true,
              body: [
                '## Como instalar',
                '',
                'Baixe o instalador do Windows em **Assets**, logo abaixo. Não precisa compilar nada.',
                '',
                '- **Instalador:** o arquivo terminado em `_x64-setup.exe` (ou o `.msi`, se preferir).',
                '- **Aviso do SmartScreen:** o instalador não é assinado, então o Windows pode avisar na primeira vez. Clique em **Mais informações** → **Executar assim mesmo**.',
                '',
                'Já tem o app instalado? Ele avisa sozinho quando há versão nova; é só clicar em **Atualizar**.',
                '',
                'No app desktop os dados ficam só no seu computador. Use o botão de **backup** no cabeçalho para exportar uma cópia de vez em quando.',
              ].join('\n'),
            })
            return data.id

  instaladores:
    name: Instaladores (${{ matrix.nome }})
    needs: criar-release
    strategy:
      fail-fast: false
      matrix:
        # Por enquanto só Windows. Para voltar a gerar macOS e Linux, descomente as entradas
        # abaixo e atualize as instruções de instalação (release e README).
        include:
          - nome: Windows
            sistema: windows-latest
            args: ''
          # - nome: macOS Apple Silicon
          #   sistema: macos-latest
          #   args: --target aarch64-apple-darwin
          # - nome: macOS Intel
          #   sistema: macos-latest
          #   args: --target x86_64-apple-darwin
          # - nome: Linux
          #   sistema: ubuntu-22.04
          #   args: ''
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v5

      - name: Dependências do Linux
        if: matrix.sistema == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.sistema == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Sem a chave pública no tauri.conf.json, os apps instalados não conseguiriam conferir as atualizações.
      - name: Conferir chave do atualizador
        shell: bash
        run: |
          if grep -q 'COLE_AQUI_A_CHAVE_PUBLICA' src-tauri/tauri.conf.json; then
            echo "::error::Falta a chave pública do atualizador (plugins.updater.pubkey) em src-tauri/tauri.conf.json."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Falta o secret TAURI_SIGNING_PRIVATE_KEY para assinar as atualizações."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # tauri.release.conf.json liga a assinatura das atualizações. O tauri-action sobe o latest.json
      # na release, e o app instalado o consulta em releases/latest/download/latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.criar-release.outputs.id }}
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
          updaterJsonPreferNsis: true

  publicar:
    name: Publicar release
    needs: [criar-release, instaladores]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number('${{ needs.criar-release.outputs.id }}'),
              draft: false,
              make_latest: 'true',
            })
